---
dim:
  dim_is_enable: true
  protected_process:
    - "/usr/bin/bash"
    - "/usr/bin/bash"
    - "/usr/bin/bash"
  protected_modules:
    - "dim_core"
  protect_kernel: true
  core_func:
    measure_log_capacity: 100
    measure_schedule: 100
    measure_interval: 1000
    measure_hash: "sha256"
    measure_pcr: 11
    signature: true
  monitor_func:
    module_type: "default"
    measure_log_capacity: 1000
    measure_hash: "sha256"
    measure_pcr: 12
  baseline_is_enable: true
...


